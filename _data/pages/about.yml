title: "About Divine CPA"
subtitle: "Your trusted partner in financial success"

story:
  heading: "Our Story"
  para1: "Divine CPA, PLLC was founded on the belief that exceptional accounting services should combine technical expertise with genuine personal attention. Located in Mesa, Arizona, we've built our practice on the foundation of helping individuals and businesses navigate the complex world of taxes and accounting with confidence."
  para2: "Our approach is simple: we see beyond the numbers to understand your unique story, goals, and challenges. Whether you're a small business owner looking to optimize your operations, an individual seeking tax savings, or someone facing IRS issues, we're here to provide expert guidance with a personal touch."
  para3: "We believe accounting is more than just number-crunching—it's about building relationships, understanding your vision, and helping you achieve your financial goals. Our team combines years of professional experience with a commitment to staying current on the latest tax laws and accounting practices."
  para4: "When you work with Divine CPA, you're not just getting a tax preparer or bookkeeper—you're gaining a trusted advisor who's invested in your success. We take the time to understand your situation, explain complex concepts in plain language, and develop strategies tailored to your needs."

values:
  - title: "Professionalism"
    description: "By combining the expertise, experience, and energy in our office, each client receives close personal and professional attention. We maintain high standards that exceed client expectations."
  - title: "Responsiveness"
    description: "Our firm is dedicated to being responsive to client inquiries. We provide competent advice and accurate answers within reasonable timeframes, leveraging technology to deliver secure information promptly."
  - title: "Quality"
    description: "An accounting firm is known for the quality of its service and we demand high standards of ourselves. We're committed to continuous professional education to improve our financial, tax, and technical knowledge. Our primary goal is to provide insightful advice to enable informed decisions."
